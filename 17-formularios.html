<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container">
        <h1>Formulario HTML e processamento externo com PHP</h1>
        <hr>
        <form action="" method="post">
            <div class="mb-3">
                <label class="form-label" for="nome">Nome:</label>
                <input class="form-control" type="text" name="nome" id="nome">
            </div>
            <div class="mb-3">
                <label class="form-label" for="Email">E-mail:</label>
                <input class="form-control" type="email" name="Email" id="Email">
            </div>
            <div class="mb-3">
                <label class="form-label" for="idade">Idade:</label>
                <input class="form-control" type="number" name="idade" id="idade" min="0" max="130">
            </div>

            <div class="mb-3">
                <p class="mb-2">Interesses:</p>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="interresses" id="html">
                    <label class="form-check-label" for="html">HTML</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="interresses" id="CSS">
                    <label class="form-check-label" for="css">CSS</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="interresses" id="javascript">
                    <label  for="javascript"class="form-check-label">Javascript</label>
                </div>
                </div>

                <div class="mb-3">
                    <p class="mb-2">Deseja receber informativos?</p>
                    <div class="form-cheak">
                        <input class="form-cheak-input" type="radio" name="informativos" id="sim">
                        <label for="sim" class="form-cheak-label">Sim</label>
                    </div>
                    <div class="form-cheak">
                        <input class="form-cheak-input" type="radio" name="informativos" id="nao">
                        <label for="nao" class="form-cheak-label">Não</label>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="mensagem" class="form-label">Mensagem</label>
                    <textarea class="form-control" name="mensagem" id="mensagem" rows="4"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Enviar Dados</button>

            </div>
        </form>
    </div>
    








    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
